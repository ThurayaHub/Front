name: Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.7
  API_BASE_URL: https://thuraya-test-api.onrender.com
  FIREBASE_PROJECT_ID: thuraya-test-amr-202609
  FIREBASE_PROJECT_NUMBER: "169571866831"

jobs:
  validate:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # MapLibre's Android module targets Java 21.
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter compact

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build production web bundle
        run: flutter build web --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Upload Android artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: thuraya-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload web artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: thuraya-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy Firebase Hosting
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://thuraya-test-amr-202609.web.app
    concurrency:
      group: frontend-production
      cancel-in-progress: true

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Download tested web bundle
        uses: actions/download-artifact@v4
        with:
          name: thuraya-web-${{ github.sha }}
          path: build/web

      - name: Validate Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THURAYA_TEST_AMR_202609 }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
          EXPECTED_FIREBASE_PROJECT_NUMBER: ${{ env.FIREBASE_PROJECT_NUMBER }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Add FIREBASE_SERVICE_ACCOUNT_THURAYA_TEST_AMR_202609 to the repository's Actions secrets."
            exit 1
          fi
          node <<'NODE'
          let credentials;

          try {
            credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          } catch {
            throw new Error(
              'FIREBASE_SERVICE_ACCOUNT_THURAYA_TEST_AMR_202609 must contain the complete, unedited JSON key file.',
            );
          }

          const expectedProjectId = process.env.EXPECTED_FIREBASE_PROJECT_ID;
          const expectedProjectNumber = process.env.EXPECTED_FIREBASE_PROJECT_NUMBER;

          if (credentials.type !== 'service_account') {
            throw new Error('Firebase credentials must be a service-account JSON key.');
          }

          if (credentials.project_id !== expectedProjectId) {
            throw new Error(
              `Firebase secret belongs to ${credentials.project_id}, expected ${expectedProjectId}.`,
            );
          }

          const validClientEmail =
            credentials.client_email?.endsWith(
              `@${expectedProjectId}.iam.gserviceaccount.com`,
            ) ||
            credentials.client_email ===
              `${expectedProjectId}@appspot.gserviceaccount.com` ||
            credentials.client_email ===
              `${expectedProjectNumber}-compute@developer.gserviceaccount.com`;

          if (!validClientEmail) {
            throw new Error(
              `The JSON project_id says ${expectedProjectId}, but its client_email belongs to another project. Download a new, unedited key from the ${expectedProjectId} project.`,
            );
          }

          if (!credentials.private_key || !credentials.private_key_id) {
            throw new Error('Firebase service-account JSON is missing its private key.');
          }

          console.log(`Validated Firebase service account for ${expectedProjectId}.`);
          NODE

      - name: Deploy live site
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          # Override any quota project inherited from older credentials.
          GOOGLE_CLOUD_QUOTA_PROJECT: ${{ env.FIREBASE_PROJECT_ID }}
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THURAYA_TEST_AMR_202609 }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Verify live site
        shell: bash
        run: |
          expected_sha="$(sha256sum build/web/main.dart.js | awk '{print $1}')"

          for attempt in {1..6}; do
            remote_sha="$(
              curl --fail --silent --show-error \
                --header 'Cache-Control: no-cache' \
                "https://thuraya-test-amr-202609.web.app/main.dart.js?commit=${GITHUB_SHA}" \
              | sha256sum | awk '{print $1}'
            )"

            if [ "$remote_sha" = "$expected_sha" ]; then
              echo "Verified deployed main.dart.js for commit ${GITHUB_SHA}."
              exit 0
            fi

            echo "Deployment has not propagated yet (attempt ${attempt}/6)."
            sleep 5
          done

          echo "::error::Firebase does not serve the web artifact built by this run."
          exit 1
